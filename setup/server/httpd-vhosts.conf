# Single host for the Picasso web stack. Paths are rewritten at install time.
<VirtualHost *:80>
    ServerAdmin admin@picasso.local
    ServerName picassoapp.local
    ServerAlias localhost 127.0.0.1
    DocumentRoot "__PICASSO_ROOT__/www"

    <Directory "__PICASSO_ROOT__/www">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ProxyPass /ws ws://127.0.0.1:10002/ws
    ProxyPassReverse /ws ws://127.0.0.1:10002/ws

    ProxyIOBufferSize 65536
    LimitRequestBody 0

    ErrorLog "logs/picassoapp.error.log"
    CustomLog "logs/picassoapp.access.log" common
</VirtualHost>
